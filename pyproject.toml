[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-signal-tracker"
version = "1.0.0"
description = "Daily automated briefing on fintech IPO filings, Office-of-the-CFO software stocks and trending topics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adi" }]
dependencies = ["requests>=2.31", "PyYAML>=6", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
signal-tracker = "signal_tracker.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_tracker = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
